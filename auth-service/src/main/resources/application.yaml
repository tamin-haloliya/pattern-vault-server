spring:
  application:
    name: auth-service

  config:
    import:
      - optional:file:../config/.env.common[.properties]
      - optional:file:../config/.env.authservice[.properties]

  datasource:
    url: jdbc:postgresql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:5432}/${AUTH_DB_NAME:auth_db}
    username: ${AUTH_DB_USER:postgres}
    password: ${AUTH_DB_PASSWORD:postgres}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${AUTH_REDIS_HOST:localhost}
      port: ${AUTH_REDIS_PORT:6379}
      database: 0
      password: ${AUTH_REDIS_PASSWORD}
      timeout: 2000ms

eureka:
  client:
    service_url:
      defaultZone: ${EUREKA_URI}

jwt:
  secret: ${JWT_SECRET}