services:
  auth-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
    ports:
      - "${AUTH_DB_PORT:-5433}:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-redis:
    image: redis:8.10-alpine
    command: redis-server --requirepass ${AUTH_REDIS_PASSWORD:-defaultpassword}
    environment:
      - REDIS_PASSWORD=${AUTH_REDIS_PASSWORD:-defaultpassword}
    ports:
      - "${AUTH_REDIS_PORT:-6379}:6379"
    volumes:
      - auth-redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${AUTH_REDIS_PASSWORD}\" ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  auth-db-data:
  auth-redis-data: